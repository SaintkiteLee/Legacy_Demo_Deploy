name: Deploy

on:
  workflow_dispatch:
    inputs:
      module:
        description: Submodule path to deploy, or all
        required: true
        type: choice
        default: all
        options:
          - all
          - bems_legacy_backend
          - bems_legacy_frontend
          - ebms_legacy_backend
          - ebms_legacy_frontend
          - ebms_legacy_python_module
      branch:
        description: Submodule branch to deploy
        required: false
        default: develop
  repository_dispatch:
    types:
      - submodule-pushed

permissions:
  contents: write

concurrency:
  group: legacy-demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      MODULE: ${{ github.event.client_payload.module || inputs.module || 'all' }}
      SUBMODULE_BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'develop' }}
      SUBMODULE_SHA: ${{ github.event.client_payload.sha || '' }}
      PARENT_BRANCH: ${{ vars.DEPLOY_BRANCH || 'develop' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_DIR:?DEPLOY_DIR secret is required}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"

          DEPLOY_SSH_KEY_PATH="$HOME/.ssh/saint_maas"
          DEPLOY_KNOWN_HOSTS_PATH="$HOME/.ssh/known_hosts"
          if [ ! -f "$DEPLOY_SSH_KEY_PATH" ]; then
            echo "::error::SSH key not found: $DEPLOY_SSH_KEY_PATH"
            exit 1
          fi

          if [ ! -r "$DEPLOY_SSH_KEY_PATH" ]; then
            echo "::error::SSH key is not readable: $DEPLOY_SSH_KEY_PATH"
            exit 1
          fi

          if [ ! -f "$DEPLOY_KNOWN_HOSTS_PATH" ]; then
            echo "::error::known_hosts not found: $DEPLOY_KNOWN_HOSTS_PATH"
            echo "::error::Register the deploy host key on the self-hosted runner before running this workflow."
            exit 1
          fi

          if [ ! -r "$DEPLOY_KNOWN_HOSTS_PATH" ]; then
            echo "::error::known_hosts is not readable: $DEPLOY_KNOWN_HOSTS_PATH"
            exit 1
          fi

          if [ "$DEPLOY_PORT" = "22" ]; then
            lookup_host="$DEPLOY_HOST"
          else
            lookup_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi

          if ! ssh-keygen -F "$lookup_host" -f "$DEPLOY_KNOWN_HOSTS_PATH" > /dev/null; then
            echo "::error::No trusted host key found for $lookup_host in $DEPLOY_KNOWN_HOSTS_PATH"
            echo "::error::Add the host key to the self-hosted runner manually. This workflow will not create or append known_hosts entries."
            exit 1
          fi

          case "$MODULE" in
            all|bems_legacy_backend|bems_legacy_frontend|ebms_legacy_backend|ebms_legacy_frontend|ebms_legacy_python_module) ;;
            *)
              echo "::error::Unsupported module: $MODULE"
              exit 1
              ;;
          esac

          if [[ ! "$SUBMODULE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unsupported submodule branch: $SUBMODULE_BRANCH"
            exit 1
          fi

          if [[ ! "$PARENT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unsupported parent branch: $PARENT_BRANCH"
            exit 1
          fi

          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_KEY_PATH=$DEPLOY_SSH_KEY_PATH" >> "$GITHUB_ENV"
          echo "DEPLOY_KNOWN_HOSTS_PATH=$DEPLOY_KNOWN_HOSTS_PATH" >> "$GITHUB_ENV"

      - name: Checkout parent repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PARENT_BRANCH }}
          fetch-depth: 0

      - name: Update submodule pointer
        if: ${{ github.event_name == 'repository_dispatch' && env.MODULE != 'all' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SUBMODULE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Unsupported submodule sha: $SUBMODULE_SHA"
            exit 1
          fi

          git fetch origin "$PARENT_BRANCH"
          git checkout "$PARENT_BRANCH"
          git pull --ff-only origin "$PARENT_BRANCH"

          mode="$(git ls-files -s -- "$MODULE" | awk '{print $1}')"
          if [ "$mode" != "160000" ]; then
            echo "::error::$MODULE is not a registered submodule"
            exit 1
          fi

          git update-index --cacheinfo 160000 "$SUBMODULE_SHA" "$MODULE"

          if git diff --cached --quiet -- "$MODULE"; then
            echo "$MODULE already points to $SUBMODULE_SHA"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update ${MODULE} submodule" \
            -m "Update ${MODULE} to ${SUBMODULE_SHA} from ${SUBMODULE_BRANCH}."
          git push origin "HEAD:${PARENT_BRANCH}"

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail

          remote_env=(
            "DEPLOY_DIR=$(printf '%q' "$DEPLOY_DIR")"
            "PARENT_BRANCH=$(printf '%q' "$PARENT_BRANCH")"
            "MODULE=$(printf '%q' "$MODULE")"
            "SUBMODULE_BRANCH=$(printf '%q' "$SUBMODULE_BRANCH")"
            "DEPLOY_EVENT=$(printf '%q' "$GITHUB_EVENT_NAME")"
          )

          ssh -p "$DEPLOY_PORT" \
            -i "$DEPLOY_SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS_PATH" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${remote_env[*]} bash -s" <<'REMOTE'
          set -euo pipefail

          resolve_deploy_dir() {
            case "$1" in
              "~")
                printf '%s\n' "$HOME"
                ;;
              "~/"*)
                printf '%s/%s\n' "$HOME" "${1#~/}"
                ;;
              *)
                printf '%s\n' "$1"
                ;;
            esac
          }

          DEPLOY_DIR="$(resolve_deploy_dir "$DEPLOY_DIR")"

          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "Deploy directory does not exist: $DEPLOY_DIR" >&2
            exit 1
          fi

          cd "$DEPLOY_DIR"

          git fetch origin "$PARENT_BRANCH"
          git checkout "$PARENT_BRANCH"
          git pull --ff-only origin "$PARENT_BRANCH"
          git submodule sync --recursive
          git submodule update --init --recursive

          echo "Deploy trigger module: $MODULE"
          if [ "$DEPLOY_EVENT" = "workflow_dispatch" ]; then
            if [ "$MODULE" = "all" ]; then
              git submodule foreach --recursive '
                target_branch=${SUBMODULE_BRANCH:-develop}
                git fetch origin "$target_branch"
                git checkout "$target_branch"
                git pull --ff-only origin "$target_branch"
              '
            else
              git -C "$MODULE" fetch origin "$SUBMODULE_BRANCH"
              git -C "$MODULE" checkout "$SUBMODULE_BRANCH"
              git -C "$MODULE" pull --ff-only origin "$SUBMODULE_BRANCH"
            fi
          fi

          if docker compose version >/dev/null 2>&1; then
            compose() { docker compose "$@"; }
          else
            compose() { docker-compose "$@"; }
          fi

          compose up -d --build
          compose ps
          REMOTE
