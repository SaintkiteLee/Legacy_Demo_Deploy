version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: batterfly123!@#
      MYSQL_DATABASE: ara_ebms_2
    ports:
      - "3308:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always

  bems_backend:
    build:
      context: ./bems_legacy_backend
      dockerfile: Dockerfile
    ports:
      - "1124:1124"
    depends_on:
      - mariadb
    restart: on-failure

  bems_frontend:
    build:
      context: ./bems_legacy_frontend
      dockerfile: Dockerfile
    ports:
      - "1123:80"
    depends_on:
      - bems_backend
    restart: on-failure

  ebms_backend:
    build:
      context: ./ebms_legacy_backend
      dockerfile: Dockerfile
    ports:
      - "1122:1122"
    depends_on:
      - mariadb
    restart: on-failure

  ebms_frontend:
    build:
      context: ./ebms_legacy_frontend
      dockerfile: Dockerfile
    ports:
      - "1234:80"
    depends_on:
      - ebms_backend
    restart: on-failure

  python_module:
    build:
      context: ./ebms_legacy_python_module
      dockerfile: Dockerfile
    environment:
      EVENT_INFO_DAILY_LIMIT: ${EVENT_INFO_DAILY_LIMIT:-1000}
      EVENT_INFO_COOLDOWN_SECONDS: ${EVENT_INFO_COOLDOWN_SECONDS:-60}
      EVENT_INFO_COOLDOWN_OVER_SPEED_SECONDS: ${EVENT_INFO_COOLDOWN_OVER_SPEED_SECONDS:-60}
      EVENT_INFO_COOLDOWN_RAPID_ACCEL_SECONDS: ${EVENT_INFO_COOLDOWN_RAPID_ACCEL_SECONDS:-60}
      EVENT_INFO_COOLDOWN_RAPID_DECEL_SECONDS: ${EVENT_INFO_COOLDOWN_RAPID_DECEL_SECONDS:-60}
      EVENT_INFO_COOLDOWN_LOW_BATTERY_SECONDS: ${EVENT_INFO_COOLDOWN_LOW_BATTERY_SECONDS:-300}
      EVENT_INFO_COOLDOWN_FAULT_OVERHEAT_SECONDS: ${EVENT_INFO_COOLDOWN_FAULT_OVERHEAT_SECONDS:-300}
      SIM_VEHICLE_LIMIT: ${SIM_VEHICLE_LIMIT:-20}
      SIM_DRIVING_UPDATE_INTERVAL_SECONDS: ${SIM_DRIVING_UPDATE_INTERVAL_SECONDS:-5}
      SIM_SENSOR_UPDATE_INTERVAL: ${SIM_SENSOR_UPDATE_INTERVAL:-12}
      SIM_FULL_SENSOR_UPDATE_INTERVAL: ${SIM_FULL_SENSOR_UPDATE_INTERVAL:-120}
      SIM_EVENT_DAILY_LIMIT: ${SIM_EVENT_DAILY_LIMIT:-900}
      SIM_HVAC_TOGGLE_INTERVAL_SECONDS: ${SIM_HVAC_TOGGLE_INTERVAL_SECONDS:-7200}
      DEMO_EVENT_PROBABILITY: ${DEMO_EVENT_PROBABILITY:-0.001}
    depends_on:
      - mariadb
    restart: on-failure
